name: Blueprint refresh

on:
  schedule:
    # Off the hour: scheduled runs at :00 are the ones GitHub delays most
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths: ["data/blueprint.json", "data/README.template.md", "profile.json", "scripts/build_blueprint.py", "tests/test_blueprint.py", ".github/workflows/signal.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the generator
        run: python3 -m unittest tests.test_blueprint -v

      # Re-finds every linked line at each repo's current commit. An unreachable repo keeps its last result.
      - name: Refresh code links and redraw the blueprints
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_blueprint.py

      - name: Commit if changed
        run: |
          git add README.md data/evidence.json assets/blueprint
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh blueprints and code links"
          git pull --rebase origin main
          git push
