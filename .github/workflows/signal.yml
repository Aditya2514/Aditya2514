name: Live signal

on:
  schedule:
    # Off the hour: scheduled runs at :00 are the ones GitHub delays most
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths-ignore: ["assets/atlas/**", "data/atlas.json", "data/repos.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the generators
        run: python3 -m unittest discover -s tests -v

      # A failed GitHub request keeps the last good data, so this step still succeeds
      - name: Refresh GitHub data and rebuild the profile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_atlas.py --refresh

      - name: Commit if changed
        run: |
          git add assets/atlas data/atlas.json data/repos.json README.md
          if git diff --cached --quiet; then
            echo "No change in signal."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile data"
          git pull --rebase origin main
          git push
