name: Aurora refresh

on:
  schedule:
    # Off the hour: scheduled runs at :00 are the ones GitHub delays most
    - cron: "17 */6 * * *"
  push:
    branches: [main, claude/ecstatic-hawking-uvnd4a]
    paths: ["data/aurora.json", "data/README.template.md", "profile.json", "scripts/**", "tests/test_aurora.py", ".github/workflows/signal.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signal
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the generator
        run: python3 -m unittest tests.test_aurora -v

      # Live stats over GraphQL, code links and metrics over REST. Anything unreachable keeps its last saved value.
      - name: Fetch live data and redraw every scene
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_aurora.py

      - name: Commit if changed
        run: |
          git add README.md data/github.json data/evidence.json assets/aurora
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh aurora scenes"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"
