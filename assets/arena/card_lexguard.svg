<title id="t">LexGuard: AI contract review for Indian law</title>
<desc id="d">Project card for LexGuard, a solo project from May to August 2026. Illustrative run: a scan passes three contract clauses; the LLM rated 'Repay 3,00,000 rupees if you resign' LOW, and one of 36 trap patterns forces it to CRITICAL. The citation verifier marks Indian Contract Act section 27 strong and section 412 hallucinated. Stack: Node.js, Redis job queue, MongoDB Atlas Vector Search.</desc>
