<text class="arena-label" x="884" y="28" text-anchor="end" fill="#8faea5">MODEL / CODE / PERSON</text><circle cx="902" cy="24" r="4" fill="#54cbd5" class="arena-dot"/>
<svg xmlns="http://www.w3.org/2000/svg" x="12" y="48" width="900" height="522" viewBox="0 0 900 522" role="img" aria-labelledby="t d">
<title id="t">How I build: one pattern across four AI projects</title>
<desc id="d">LexGuard: Risk analyst + adversarial judge rate every clause / 36 trap patterns + cross-clause contradiction rules / Signer reviews ratings, cited statutes, rewrites. Resilion: Risk Watcher agent turns news into disruption events / Graph traversal traces which industries are hit / Reroutes will need sign-off (approval console planned). Pikina: Local Ollama parses intent when regex routes miss / Validation layer checks every model-proposed action / Native consent popup before any level-4+ action. Noesis: gpt-oss on Groq drafts the answer in one grounded pass / Hybrid BM25 + dense retrieval with reranking / Answers cite the timestamp, page or frame used.</desc>
<rect x="0.5" y="0.5" width="899" height="521" rx="16" fill="#080a0f" stroke="#293341"/>
<text x="32" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#f5a524">HOW I BUILD</text>
<text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">The model never gets the last word</text>
