<title id="t">Pikina: offline-first personal operating layer</title>
<desc id="d">Project card for Pikina, pre-alpha, started July 2026. Illustrative run in the quick panel: 'add todo call mom' matches a Tier 1 regex route, with no model call. 'remind me to pay rent' matches no regex, so it goes to a local llama3 model through Ollama, which must return a registered tool or no_match; it proposes todo.add at level 0, the Action Validation Layer checks that the tool is registered and the claimed level matches the registry, and it runs. Actions at level 4 or above, or with irreversible side effects, ask for native consent first. Stack: Python, Ollama, Electron.</desc>
