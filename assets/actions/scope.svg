<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="a-title">
<title id="a-title">Patt se headshot! A scope tracks a symbolic software bug, locks on and confirms the hit.</title><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}
.a-scope{animation:a-scope 10s ease-in-out infinite;transform-origin:0 0}
.a-target{animation:a-target 10s ease-in-out infinite}
.a-cross{animation:a-cross 10s ease-in-out infinite}
.a-hit{opacity:0;animation:a-hit 10s ease-in-out infinite}
.a-confirm{opacity:0;animation:a-confirm 10s ease-in-out infinite}
.a-trace{stroke-dasharray:38 600;animation:a-trace 8s linear infinite}
.a-glow{animation:a-glow 5s ease-in-out infinite}
.a-smoke{animation:a-smoke 7s ease-out infinite;transform-box:fill-box;transform-origin:center}
.a-frag{animation:a-frag 8s ease-in-out infinite}
.a-burst{opacity:0;animation:a-burst 8s ease-out infinite;transform-origin:100px 143px}
.a-flame{animation:a-flame 3s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.a-can{animation:a-can 4s ease-in-out infinite}
.a-energy{animation:a-energy 4s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
.a-feed{animation:a-feed 12s linear infinite}
@keyframes a-scope{0%,10%{transform:scale(.82) rotate(-5deg);opacity:.6}30%,68%{transform:scale(1) rotate(0);opacity:1}80%,100%{transform:scale(.82) rotate(-5deg);opacity:.6}}
@keyframes a-target{0%,12%{transform:translate(48px,-28px)}32%,70%{transform:translate(0,0)}85%,100%{transform:translate(48px,-28px)}}
@keyframes a-cross{0%,20%{stroke:#54cbd5}35%,70%{stroke:#ffc247}80%,100%{stroke:#54cbd5}}
@keyframes a-hit{0%,43%,78%,100%{opacity:0}49%,63%{opacity:1}}
@keyframes a-confirm{0%,45%,82%,100%{opacity:0;transform:translateY(8px)}51%,74%{opacity:1;transform:translateY(0)}}
@keyframes a-trace{to{stroke-dashoffset:-638}}
@keyframes a-glow{50%{opacity:.5}}
@keyframes a-smoke{0%{transform:translate(0,15px) scale(.55);opacity:0}20%{opacity:.4}70%{opacity:.22}100%{transform:translate(25px,-55px) scale(1.45);opacity:0}}
@keyframes a-frag{0%,12%{transform:translate(-30px,35px) rotate(-20deg)}40%,60%{transform:translate(25px,-25px) rotate(80deg)}75%,100%{transform:translate(-30px,35px) rotate(-20deg)}}
@keyframes a-burst{0%,40%,85%,100%{opacity:0;transform:scale(.4)}50%{opacity:.8;transform:scale(.9)}75%{opacity:0;transform:scale(1.5)}}
@keyframes a-flame{50%{transform:scaleX(.8) scaleY(1.15);opacity:.75}}
@keyframes a-can{50%{transform:translateY(-9px)}}
@keyframes a-energy{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes a-feed{0%,100%{transform:translateX(0)}50%{transform:translateX(-12px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.a-hit,.a-confirm{opacity:1}.a-smoke{opacity:.2}}
</style>
<defs><pattern id="a-grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#202736" stroke-width=".5"/></pattern><radialGradient id="a-glass"><stop stop-color="#182c35"/><stop offset="1" stop-color="#080c12"/></radialGradient><clipPath id="a-clip"><rect x="1" y="1" width="1198" height="428" rx="12"/></clipPath></defs>
<rect x="1" y="1" width="1198" height="428" rx="12" fill="#06080d" stroke="#293341"/>
<g clip-path="url(#a-clip)"><rect width="1200" height="430" fill="url(#a-grid)"/><text x="42" y="45" font-size="15" fill="#54cbd5" class="mono">SCOPE IN / DEBUG MODE</text><text x="40" y="132" font-size="70" fill="#edf2f7" font-weight="900">PATT SE</text><text x="40" y="210" font-size="70" fill="#ffc247" font-weight="900">HEADSHOT!</text><text x="44" y="254" font-size="21" fill="#9daab9" font-weight="700">AIM AT THE BUG. SHIP THE FIX.</text><g class="a-confirm"><rect x="44" y="284" width="393" height="46" rx="4" fill="#222014" stroke="#ffc247"/><text x="62" y="314" font-size="17" fill="#ffc247" class="mono">BUG ELIMINATED / NEXT COMMIT</text></g><g transform="translate(940 204)"><g class="a-scope"><circle r="164" fill="#0a1018" stroke="#303c4b" stroke-width="15"/><circle r="150" fill="url(#a-glass)" stroke="#54cbd5" stroke-opacity=".6"/><path d="M142.00 0.00L129.00 0.00" stroke="#627b8c"/><path d="M137.16 36.75L131.37 35.20" stroke="#627b8c"/><path d="M122.98 71.00L117.78 68.00" stroke="#627b8c"/><path d="M100.41 100.41L91.22 91.22" stroke="#627b8c"/><path d="M71.00 122.98L68.00 117.78" stroke="#627b8c"/><path d="M36.75 137.16L35.20 131.37" stroke="#627b8c"/><path d="M0.00 142.00L0.00 129.00" stroke="#627b8c"/><path d="M-36.75 137.16L-35.20 131.37" stroke="#627b8c"/><path d="M-71.00 122.98L-68.00 117.78" stroke="#627b8c"/><path d="M-100.41 100.41L-91.22 91.22" stroke="#627b8c"/><path d="M-122.98 71.00L-117.78 68.00" stroke="#627b8c"/><path d="M-137.16 36.75L-131.37 35.20" stroke="#627b8c"/><path d="M-142.00 0.00L-129.00 0.00" stroke="#627b8c"/><path d="M-137.16 -36.75L-131.37 -35.20" stroke="#627b8c"/><path d="M-122.98 -71.00L-117.78 -68.00" stroke="#627b8c"/><path d="M-100.41 -100.41L-91.22 -91.22" stroke="#627b8c"/><path d="M-71.00 -122.98L-68.00 -117.78" stroke="#627b8c"/><path d="M-36.75 -137.16L-35.20 -131.37" stroke="#627b8c"/><path d="M-0.00 -142.00L-0.00 -129.00" stroke="#627b8c"/><path d="M36.75 -137.16L35.20 -131.37" stroke="#627b8c"/><path d="M71.00 -122.98L68.00 -117.78" stroke="#627b8c"/><path d="M100.41 -100.41L91.22 -91.22" stroke="#627b8c"/><path d="M122.98 -71.00L117.78 -68.00" stroke="#627b8c"/><path d="M137.16 -36.75L131.37 -35.20" stroke="#627b8c"/><g class="a-target"><rect x="-34" y="-39" width="68" height="78" rx="15" fill="#301d24" stroke="#ee7180" stroke-width="2"/><path d="M0-35V35M-34-20L-51-35M-34 0H-56M-34 20L-51 35M34-20L51-35M34 0H56M34 20L51 35" fill="none" stroke="#ee7180" stroke-width="3"/><text x="0" y="7" font-size="15" fill="#edf2f7" text-anchor="middle" font-weight="700">BUG</text></g><g fill="none" stroke="#54cbd5" stroke-width="1.5" class="a-cross"><path d="M-147 0H-47M47 0H147M0-147V-47M0 47V147"/><circle r="45"/><path d="M-10 0H10M0-10V10"/><path d="M-25 75H25M-17 96H17M-9 116H9"/></g><g stroke="#ffc247" stroke-width="5" class="a-hit"><path d="M-47-47L-28-28M47-47L28-28M-47 47L-28 28M47 47L28 28"/></g></g><text x="0" y="194" font-size="13" fill="#54cbd5" class="mono" text-anchor="middle">4x / BUG HUNT</text></g><path d="M44 372h135" stroke="#303c4b" stroke-width="3"/><path d="M44 372h135" stroke="#ffc247" stroke-width="3" class="a-trace" style="animation-delay:-0s"/><text x="44" y="400" font-size="13" fill="#9daab9" class="mono">01 / SCOUT</text><path d="M207 372h135" stroke="#303c4b" stroke-width="3"/><path d="M207 372h135" stroke="#ffc247" stroke-width="3" class="a-trace" style="animation-delay:-2s"/><text x="207" y="400" font-size="13" fill="#9daab9" class="mono">02 / SCOPE</text><path d="M370 372h135" stroke="#303c4b" stroke-width="3"/><path d="M370 372h135" stroke="#ffc247" stroke-width="3" class="a-trace" style="animation-delay:-4s"/><text x="370" y="400" font-size="13" fill="#9daab9" class="mono">03 / LOCK</text><path d="M533 372h135" stroke="#303c4b" stroke-width="3"/><path d="M533 372h135" stroke="#ffc247" stroke-width="3" class="a-trace" style="animation-delay:-6s"/><text x="533" y="400" font-size="13" fill="#9daab9" class="mono">04 / DEBUG</text></g>
<path d="M16 1H1184" fill="none" stroke="#ffc247" stroke-width="2" class="a-trace"/>
</svg>