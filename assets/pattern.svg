<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 522" width="100%" role="img" aria-labelledby="t d">
<title id="t">How I build: one pattern across four AI projects</title>
<desc id="d">LexGuard: Risk analyst + adversarial judge rate every clause / 38 trap patterns + cross-clause contradiction rules / Signer reviews ratings, cited statutes, rewrites. Resilion: Risk Watcher agent turns news into disruption events / Graph traversal proves the downstream impact / No rerouting order runs without approval. Pikina: Local Ollama parses intent when regex routes miss / Validation layer + DAG checks gate every task / Consent popup for risky OS actions; rollback on failure. Noesis: Llama 3.3 drafts the answer in one grounded pass / Hybrid BM25 + dense retrieval with reranking / Answers cite the timestamp, page or frame used.</desc>
<rect x="0.5" y="0.5" width="899" height="521" rx="16" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3" fill="#f5a524">HOW I BUILD</text>
<text x="32" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#e6edf3">The model never gets the last word</text>
<text x="230" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#2dd4bf">01  MODEL PROPOSES</text>
<text x="452" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#f5a524">02  CODE VERIFIES</text>
<text x="674" y="110" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" letter-spacing="2" fill="#c9d1d9">03  A PERSON DECIDES</text>
