<text x="32" y="506" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">LLMs are the reasoning layer, not the foundation: deterministic code checks their output, and a person approves anything irreversible.</text>
