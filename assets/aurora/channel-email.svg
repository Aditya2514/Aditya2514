<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" role="img" aria-label="Email"><style>.tw{animation:tw 3.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 13s ease-in-out infinite alternate}@keyframes sway{0%{transform:translateX(-22px) skewX(-4deg)}100%{transform:translateX(22px) skewX(4deg)}}.sway2{transform-box:fill-box;transform-origin:50% 100%;animation:sway 17s ease-in-out -6s infinite alternate-reverse}.sh{animation:sh 2.8s ease-in-out infinite}@keyframes sh{0%,100%{opacity:.35}50%{opacity:1}}.br{animation:br 5s ease-in-out infinite}@keyframes br{0%,100%{opacity:.6}50%{opacity:1}}.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{transform:scaleY(.35)}to{transform:scaleY(1)}}.up{animation:up .9s ease-out both}@keyframes up{from{transform:translateY(10px)}to{transform:none}}.fade{animation:fade 1s ease-out both}@keyframes fade{from{filter:brightness(1.7)}to{filter:none}}.slide{animation:slide 1s cubic-bezier(.2,.8,.2,1) both}@keyframes slide{from{transform:translateX(-14px)}to{transform:none}}.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.4s ease-out both}@keyframes draw{to{stroke-dashoffset:0}}.blink{animation:blink 1.6s steps(2,start) infinite}@keyframes blink{to{opacity:.2}}.surge{animation:surge 11s cubic-bezier(.45,0,.55,1) infinite}@keyframes surge{0%{transform:translateX(0)}70%,100%{transform:translateX(var(--run,1500px))}}.flow{stroke-dasharray:7 93;animation:flow var(--d,7s) linear infinite}@keyframes flow{to{stroke-dashoffset:-100}}.scan{animation:scan var(--d,6s) ease-in-out infinite}@keyframes scan{0%{transform:translateY(0);opacity:0}12%,82%{opacity:1}100%{transform:translateY(var(--dy,100px));opacity:0}}.mistx{animation:mistx 24s ease-in-out infinite alternate}@keyframes mistx{from{transform:translateX(-90px)}to{transform:translateX(90px)}}.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.ping{transform-box:fill-box;transform-origin:center;opacity:0;animation:ping var(--d,9s) ease-out infinite}@keyframes ping{0%{transform:scale(.6);opacity:.95}10%{transform:scale(2.6);opacity:0}100%{opacity:0}}.sheen{animation:sheen 8s ease-in-out infinite}@keyframes sheen{0%,60%{transform:translateX(0)}100%{transform:translateX(var(--run,800px))}}.glA,.glB{opacity:0;animation:glA 6.5s steps(1) infinite}.glB{animation-name:glB}@keyframes glA{0%,90%,97%,100%{opacity:0;transform:none}91%{opacity:.85;transform:translate(-6px,1px)}93%{opacity:.55;transform:translate(5px,-2px)}95%{opacity:.75;transform:translate(-3px,0)}}@keyframes glB{0%,90%,97%,100%{opacity:0;transform:none}91%{opacity:.7;transform:translate(6px,-1px)}93%{opacity:.8;transform:translate(-4px,2px)}95%{opacity:.5;transform:translate(3px,0)}}.meteor{animation:meteor 9s linear infinite}@keyframes meteor{0%,82%{opacity:0;transform:translate(0,0)}84%{opacity:1}96%{opacity:0;transform:translate(-260px,120px)}100%{opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}.draw{stroke-dasharray:none}.flow,.scan,.mistx,.ping,.sheen,.fx-move,.glA,.glB{display:none}}</style><rect x=".5" y=".5" width="319" height="71" rx="36" fill="#06121c" stroke="#ffb547" stroke-opacity=".55"/><rect class="br" x=".5" y=".5" width="319" height="71" rx="36" fill="#ffb547" opacity=".06"/><rect x="19" y="24" width="30" height="22" rx="3" fill="none" stroke="#ffb547" stroke-width="1.8"/><polyline points="19,26 34,38 49,26" fill="none" stroke="#ffb547" stroke-width="1.8"/><text x="66.0" y="33.0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#eafff8" text-anchor="start" letter-spacing="0" >Email</text><text x="66.0" y="52.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="400" fill="#93b7b2" text-anchor="start" letter-spacing="0" >adityasinghv05@gmail.com</text><polyline points="280,28 290,36 280,44" fill="none" stroke="#ffb547" stroke-width="2"/></svg>