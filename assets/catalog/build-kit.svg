<text x="30" y="40" font-size="15" fill="#ffc247" class="mono">BUILD KIT / CHOOSE THE TOOL FOR THE JOB</text><text x="30" y="77" font-size="32" fill="#edf2f7" font-weight="800">Tools I reach for</text><rect x="24" y="106" width="558" height="173" rx="8" fill="#0a1018" stroke="#293341"/><path d="M36 106H570" stroke="#54cbd5" class="cat-trace" style="animation-delay:-1s"/><text x="46" y="136" font-size="15" fill="#54cbd5" class="mono" font-weight="700">LANGUAGES</text><text x="46" y="167" font-size="17" fill="#aab8c8" >Write the core logic</text><rect x="46" y="198" width="69.6" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="58" y="216" font-size="13" fill="#cbd5e3" >Python</text><rect x="123.6" y="198" width="100.0" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="135.6" y="216" font-size="13" fill="#cbd5e3" >JavaScript</text><rect x="231.6" y="198" width="100.0" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="243.6" y="216" font-size="13" fill="#cbd5e3" >TypeScript</text><rect x="339.6" y="198" width="46.8" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="351.6" y="216" font-size="13" fill="#cbd5e3" >C++</text><circle cx="556" cy="131" r="4" fill="#ffc247" class="cat-pulse"/><rect x="606" y="106" width="558" height="173" rx="8" fill="#0a1018" stroke="#293341"/><path d="M618 106H1152" stroke="#54cbd5" class="cat-trace" style="animation-delay:-1s"/><text x="628" y="136" font-size="15" fill="#54cbd5" class="mono" font-weight="700">AI &amp; RETRIEVAL</text><text x="628" y="167" font-size="17" fill="#aab8c8" >Ground answers and connect models</text><rect x="628" y="198" width="69.6" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="640" y="216" font-size="13" fill="#cbd5e3" >Ollama</text><rect x="705.6" y="198" width="69.6" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="717.6" y="216" font-size="13" fill="#cbd5e3" >Gemini</text><rect x="783.2" y="198" width="54.4" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="795.2" y="216" font-size="13" fill="#cbd5e3" >Groq</text><rect x="845.6" y="198" width="115.2" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="857.6" y="216" font-size="13" fill="#cbd5e3" >Hugging Face</text><rect x="968.8" y="198" width="84.8" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="980.8" y="216" font-size="13" fill="#cbd5e3" >ChromaDB</text><rect x="628" y="232" width="183.6" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="640" y="250" font-size="13" fill="#cbd5e3" >sentence-transformers</text><circle cx="1138" cy="131" r="4" fill="#ffc247" class="cat-pulse"/><rect x="24" y="295" width="558" height="156" rx="8" fill="#0a1018" stroke="#293341"/><path d="M36 295H570" stroke="#54cbd5" class="cat-trace" style="animation-delay:-3s"/><text x="46" y="325" font-size="15" fill="#54cbd5" class="mono" font-weight="700">BACKEND</text><text x="46" y="356" font-size="17" fill="#aab8c8" >Expose services and coordinate work</text><rect x="46" y="387" width="77.2" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="58" y="405" font-size="13" fill="#cbd5e3" >Node.js</text><rect x="131.2" y="387" width="77.2" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="143.2" y="405" font-size="13" fill="#cbd5e3" >Express</text><rect x="216.39999999999998" y="387" width="77.2" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="228.39999999999998" y="405" font-size="13" fill="#cbd5e3" >FastAPI</text><rect x="301.59999999999997" y="387" width="62.0" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="313.59999999999997" y="405" font-size="13" fill="#cbd5e3" >Flask</text><circle cx="556" cy="320" r="4" fill="#ffc247" class="cat-pulse"/><rect x="606" y="295" width="558" height="156" rx="8" fill="#0a1018" stroke="#293341"/><path d="M618 295H1152" stroke="#54cbd5" class="cat-trace" style="animation-delay:-3s"/><text x="628" y="325" font-size="15" fill="#54cbd5" class="mono" font-weight="700">DATA</text><text x="628" y="356" font-size="17" fill="#aab8c8" >Store, query and cache</text><rect x="628" y="387" width="100.0" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="640" y="405" font-size="13" fill="#cbd5e3" >PostgreSQL</text><rect x="736.0" y="387" width="77.2" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="748.0" y="405" font-size="13" fill="#cbd5e3" >MongoDB</text><rect x="821.2" y="387" width="62.0" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="833.2" y="405" font-size="13" fill="#cbd5e3" >Redis</text><rect x="891.2" y="387" width="69.6" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="903.2" y="405" font-size="13" fill="#cbd5e3" >SQLite</text><circle cx="1138" cy="320" r="4" fill="#ffc247" class="cat-pulse"/><rect x="24" y="467" width="558" height="156" rx="8" fill="#0a1018" stroke="#293341"/><path d="M36 467H570" stroke="#54cbd5" class="cat-trace" style="animation-delay:-5s"/><text x="46" y="497" font-size="15" fill="#54cbd5" class="mono" font-weight="700">INTERFACES</text><text x="46" y="528" font-size="17" fill="#aab8c8" >Make systems usable</text><rect x="46" y="559" width="62.0" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="58" y="577" font-size="13" fill="#cbd5e3" >React</text><rect x="116.0" y="559" width="115.2" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="128.0" y="577" font-size="13" fill="#cbd5e3" >React Native</text><rect x="239.2" y="559" width="84.8" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="251.2" y="577" font-size="13" fill="#cbd5e3" >Electron</text><rect x="332.0" y="559" width="92.4" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="344.0" y="577" font-size="13" fill="#cbd5e3" >Streamlit</text><circle cx="556" cy="492" r="4" fill="#ffc247" class="cat-pulse"/><rect x="606" y="467" width="558" height="156" rx="8" fill="#0a1018" stroke="#293341"/><path d="M618 467H1152" stroke="#54cbd5" class="cat-trace" style="animation-delay:-5s"/><text x="628" y="497" font-size="15" fill="#54cbd5" class="mono" font-weight="700">DELIVERY</text><text x="628" y="528" font-size="17" fill="#aab8c8" >Version, test and ship</text><rect x="628" y="559" width="46.8" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="640" y="577" font-size="13" fill="#cbd5e3" >Git</text><rect x="682.8" y="559" width="130.4" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="694.8" y="577" font-size="13" fill="#cbd5e3" >GitHub Actions</text><rect x="821.1999999999999" y="559" width="69.6" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="833.1999999999999" y="577" font-size="13" fill="#cbd5e3" >Docker</text><rect x="898.8" y="559" width="69.6" height="26" rx="5" fill="#121b28" stroke="#344252"/><text x="910.8" y="577" font-size="13" fill="#cbd5e3" >Vercel</text><circle cx="1138" cy="492" r="4" fill="#ffc247" class="cat-pulse"/><text x="30" y="656" font-size="15" fill="#8394a9" >PICK THE RIGHT TOOL. BUILD THE RIGHT THING.</text></svg>