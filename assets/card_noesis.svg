<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" width="100%" role="img" aria-labelledby="t d">
<title id="t">Noesis: multimodal RAG with per-claim citations</title>
<desc id="d">Project card for Noesis, built by a team of 2 in August 2026. Video, audio and PDF sources send chunks into an index (Whisper with word-level timestamps, keyframes de-duplicated by perceptual hash, PyMuPDF plus RapidOCR plus a Gemini vision model). Retrieval runs BM25 plus dense bge-small, fused with RRF and reranked by a cross-encoder. In this illustrative run, a Groq gpt-oss-20b answer arrives with citation chips [video 00:14:20] and [pdf p.4], checked by an LLM audit; a 0.65 confidence gate falls back to extractive answers. Stack: Python, Groq, ChromaDB, Streamlit.</desc>
