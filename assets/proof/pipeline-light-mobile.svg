<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 676" width="600" height="676" role="img" aria-label="How the audit works: claim, read, match, stamp, redraw"><style>.flow{stroke-dasharray:5 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion: reduce){.flow{animation:none}}</style><rect width="600" height="676" rx="14" fill="#ece7dc"/><rect x="40" y="40" width="520" height="92" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="62" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#c8372d">01</text><text x="106" y="78" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" fill="#1f1d1a">Claim</text><text x="106" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">22 claims, each naming a file and the exact code it</text><text x="106" y="121" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">rests on.</text><line class="flow" x1="300.0" y1="136" x2="300.0" y2="160" stroke="#c8372d" stroke-width="2.5"/><path d="M294.0,155 L300.0,163 L306.0,155" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="40" y="166" width="520" height="92" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="62" y="202" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#c8372d">02</text><text x="106" y="204" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" fill="#1f1d1a">Read</text><text x="106" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">Each repo at its latest commit, through the GitHub</text><text x="106" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">API.</text><line class="flow" x1="300.0" y1="262" x2="300.0" y2="286" stroke="#c8372d" stroke-width="2.5"/><path d="M294.0,281 L300.0,289 L306.0,281" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="40" y="292" width="520" height="92" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="62" y="328" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#c8372d">03</text><text x="106" y="330" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" fill="#1f1d1a">Match</text><text x="106" y="354" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">Find the code. Found means a line number; gone means</text><text x="106" y="373" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">stale.</text><line class="flow" x1="300.0" y1="388" x2="300.0" y2="412" stroke="#c8372d" stroke-width="2.5"/><path d="M294.0,407 L300.0,415 L306.0,407" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="40" y="418" width="520" height="92" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="62" y="454" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#c8372d">04</text><text x="106" y="456" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" fill="#1f1d1a">Stamp</text><text x="106" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">VERIFIED or STALE, with a link pinned to that</text><text x="106" y="499" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">commit.</text><line class="flow" x1="300.0" y1="514" x2="300.0" y2="538" stroke="#c8372d" stroke-width="2.5"/><path d="M294.0,533 L300.0,541 L306.0,533" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="40" y="544" width="520" height="92" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="62" y="580" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#c8372d">05</text><text x="106" y="582" font-family="Georgia, 'Times New Roman', Times, serif" font-size="26" fill="#1f1d1a">Redraw</text><text x="106" y="606" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#5d574c">Receipt, tags and this page, every six hours.</text></svg>