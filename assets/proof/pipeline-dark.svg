<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 214" width="1000" height="214" role="img" aria-label="How the audit works: claim, read, match, stamp, redraw"><style>.flow{stroke-dasharray:5 6;animation:flow 1.2s linear infinite}@keyframes flow{to{stroke-dashoffset:-22}}@media (prefers-reduced-motion: reduce){.flow{animation:none}}</style><rect width="1000" height="214" rx="14" fill="#12141a"/><rect x="24.0" y="32" width="168" height="150" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="40.0" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#c8372d">01</text><text x="40.0" y="94" font-family="Georgia, 'Times New Roman', Times, serif" font-size="25" fill="#1f1d1a">Claim</text><text x="40.0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">22 claims, each naming</text><text x="40.0" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">a file and the exact</text><text x="40.0" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">code it rests on.</text><line class="flow" x1="197.0" y1="107.0" x2="212.0" y2="107.0" stroke="#c8372d" stroke-width="2.5"/><path d="M206.0,101.0 L214.0,107.0 L206.0,113.0" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="220.0" y="32" width="168" height="150" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="236.0" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#c8372d">02</text><text x="236.0" y="94" font-family="Georgia, 'Times New Roman', Times, serif" font-size="25" fill="#1f1d1a">Read</text><text x="236.0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">Each repo at its</text><text x="236.0" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">latest commit, through</text><text x="236.0" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">the GitHub API.</text><line class="flow" x1="393.0" y1="107.0" x2="408.0" y2="107.0" stroke="#c8372d" stroke-width="2.5"/><path d="M402.0,101.0 L410.0,107.0 L402.0,113.0" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="416.0" y="32" width="168" height="150" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="432.0" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#c8372d">03</text><text x="432.0" y="94" font-family="Georgia, 'Times New Roman', Times, serif" font-size="25" fill="#1f1d1a">Match</text><text x="432.0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">Find the code. Found</text><text x="432.0" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">means a line number;</text><text x="432.0" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">gone means stale.</text><line class="flow" x1="589.0" y1="107.0" x2="604.0" y2="107.0" stroke="#c8372d" stroke-width="2.5"/><path d="M598.0,101.0 L606.0,107.0 L598.0,113.0" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="612.0" y="32" width="168" height="150" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="628.0" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#c8372d">04</text><text x="628.0" y="94" font-family="Georgia, 'Times New Roman', Times, serif" font-size="25" fill="#1f1d1a">Stamp</text><text x="628.0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">VERIFIED or STALE,</text><text x="628.0" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">with a link pinned to</text><text x="628.0" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">that commit.</text><line class="flow" x1="785.0" y1="107.0" x2="800.0" y2="107.0" stroke="#c8372d" stroke-width="2.5"/><path d="M794.0,101.0 L802.0,107.0 L794.0,113.0" fill="none" stroke="#c8372d" stroke-width="2.5"/><rect x="808.0" y="32" width="168" height="150" rx="6" fill="#f8f5ec" stroke="#ddd5c2"/><text x="824.0" y="60" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="700" letter-spacing="1" fill="#c8372d">05</text><text x="824.0" y="94" font-family="Georgia, 'Times New Roman', Times, serif" font-size="25" fill="#1f1d1a">Redraw</text><text x="824.0" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">Receipt, tags and this</text><text x="824.0" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#5d574c">page, every six hours.</text></svg>