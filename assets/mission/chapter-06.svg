ath="url(#sh1)" class="fx"><rect x="-92" y="50" width="120" height="46" fill="url(#band)" transform="skewX(-20)" class="shine" style="--dx:1200px;animation-delay:-6s"/></g><text x="30" y="120" font-size="18" fill="#a8b3bf" >The education and milestones behind the builds.</text><path d="M1 15V130" stroke="#e9b44c" stroke-width="3"/><path d="M1 15V130" stroke="#fff7dc" stroke-width="3" stroke-dasharray="26 200" class="march fx" style="animation-duration:2.6s"/><path d="M28 143H1172" stroke="#e9b44c" stroke-width="2" class="trace"/></g><rect x="1" y="1" width="1198" height="143" rx="13" fill="none" stroke="#30363d"/></svg>
