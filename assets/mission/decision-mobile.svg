<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="308" viewBox="0 0 600 308" role="img" aria-labelledby="title">
<title id="title">Why let code challenge a model? LexGuard pairs model assessments with explicit checks. A plausible answer still needs something you can verify.</title><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}
.sweep{stroke-dasharray:70 1300;animation:sweep 14s linear infinite}
.breathe{animation:breathe 8s ease-in-out infinite}
.float{animation:float 10s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.scan{animation:scan 8s ease-in-out infinite}
.step1{animation:step1 12s ease-in-out infinite}.step2{animation:step2 12s ease-in-out infinite}.step3{animation:step3 12s ease-in-out infinite}
@keyframes sweep{to{stroke-dashoffset:-1370}}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:.2}50%{transform:translateY(70px);opacity:.8}}
@keyframes step1{0%,25%,100%{opacity:1}35%,85%{opacity:.35}}
@keyframes step2{0%,20%,70%,100%{opacity:.35}35%,55%{opacity:1}}
@keyframes step3{0%,50%,100%{opacity:.35}65%,90%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs></defs>
<rect width="600" height="308" rx="16" fill="#0d1117"/><text x="28" y="36" font-size="14" fill="#e9b44c" class="mono">ENGINEERING DECISION</text><text x="28" y="68" font-size="14" fill="#e9b44c" class="mono">01 / DETERMINISTIC CHECKS</text><text x="28" y="113" font-size="28" fill="#e6edf3" font-weight="700">Why let code challenge a</text><text x="28" y="149" font-size="28" fill="#e6edf3" font-weight="700">model?</text><text x="28" y="195" font-size="22" fill="#a8b3bf" >LexGuard pairs model assessments with</text><text x="28" y="226" font-size="22" fill="#a8b3bf" >explicit checks. A plausible answer still</text><text x="28" y="257" font-size="22" fill="#a8b3bf" >needs something you can verify.</text>
<rect x="1" y="1" width="598" height="306" rx="15" fill="none" stroke="#30363d"/>
