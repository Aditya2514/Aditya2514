<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="600" height="1248" viewBox="0 0 600 1248" role="img" aria-labelledby="title">
<title id="title">Build kit: tools grouped by purpose.</title><style>text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,Menlo,monospace;letter-spacing:2px}.tag{font-family:Consolas,Menlo,monospace;letter-spacing:1px}
.trace{stroke-dasharray:160 1240;animation:trace 9s linear infinite}
.pulse{animation:pulse 3.2s ease-in-out infinite}
.blink{animation:blink 1.1s steps(2) infinite}
.spin{transform-box:fill-box;transform-origin:center;animation:spin 40s linear infinite}
.kb{animation:kb 26s ease-in-out infinite alternate}
.spark{animation:spark 7s ease-out infinite}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.6s ease-out infinite}
.glint{animation:glint 7s ease-in-out infinite}
.shine{animation:shine 6s ease-in-out infinite}
.ga{animation:ga 7s steps(1) infinite}.gb{animation:gb 7s steps(1) infinite}
.sweepy{animation:sweepy 4.5s ease-in-out infinite}
.draw{stroke-dasharray:400;animation:draw 5s ease-in-out infinite}
.march{stroke-dasharray:6 8;animation:march 1.2s linear infinite}
.compass{animation:compass 50s linear infinite}
.kf{animation:kf 10s ease-out infinite backwards}
.st{animation:st 9s linear infinite backwards}
.fill{transform-box:fill-box;transform-origin:left;animation:fill 9s linear infinite backwards}
.pop{animation:pop var(--loop,8s) linear infinite backwards}
.chev{animation:chev 1.8s linear infinite backwards}
.drift{animation:drift 16s ease-in-out infinite alternate}
.eq{animation:eq 12s linear infinite backwards}
.drop{animation:drop 16s linear infinite}
.fly{animation:fly 16s linear infinite}
.smoke{animation:smoke 5s ease-out infinite}
@keyframes trace{to{stroke-dashoffset:-1400}}
@keyframes pulse{50%{opacity:.3}}
@keyframes blink{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes spark{0%{opacity:0;transform:translate(0,14px)}25%{opacity:.85}100%{opacity:0;transform:translate(var(--sx,12px),-70px)}}
@keyframes ring{0%{transform:scale(.15);opacity:.95}100%{transform:scale(1);opacity:0}}
@keyframes glint{0%,70%{transform:translateX(0);opacity:0}73%{opacity:.55}86%{transform:translateX(var(--dx,160px));opacity:.55}89%,100%{transform:translateX(var(--dx,160px));opacity:0}}
@keyframes shine{0%,35%{transform:translateX(0)}75%,100%{transform:translateX(var(--dx,700px))}}
@keyframes ga{0%,90%,96%,100%{opacity:0;transform:translate(0,0)}91%{opacity:.85;transform:translate(-7px,2px)}93%{opacity:.6;transform:translate(5px,-2px)}95%{opacity:.75;transform:translate(-3px,0)}}
@keyframes gb{0%,90%,96%,100%{opacity:0;transform:translate(0,0)}91%{opacity:.7;transform:translate(7px,-2px)}93%{opacity:.8;transform:translate(-5px,2px)}95%{opacity:.5;transform:translate(3px,0)}}
@keyframes sweepy{0%{transform:translateY(0);opacity:0}12%{opacity:.9}88%{opacity:.9}100%{transform:translateY(var(--dy,130px));opacity:0}}
@keyframes draw{0%{stroke-dashoffset:400;opacity:0}15%{opacity:1}60%,80%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
@keyframes march{to{stroke-dashoffset:-14}}
@keyframes compass{to{transform:translateX(-720px)}}
@keyframes kf{0%{opacity:0;transform:translateX(26px)}4%,60%{opacity:1;transform:translateX(0)}68%,100%{opacity:0;transform:translateX(0)}}
@keyframes st{0%,31%{opacity:1}36%,100%{opacity:.42}}
@keyframes fill{0%{transform:scaleX(0);opacity:1}31%{transform:scaleX(1);opacity:1}35%,100%{transform:scaleX(1);opacity:0}}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}5%,82%{opacity:1;transform:translateY(0)}90%,100%{opacity:0;transform:translateY(0)}}
@keyframes chev{0%,100%{opacity:.15}30%{opacity:1}60%{opacity:.15}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-26px)}}
@keyframes eq{0%{opacity:0}1%,15%{opacity:1}18%,100%{opacity:0}}
@keyframes drop{0%{transform:translate(0,0);opacity:0}6%{opacity:1}70%{transform:translate(10px,104px);opacity:1}76%,100%{transform:translate(10px,104px);opacity:0}}
@keyframes fly{0%,8%{transform:translateX(0);opacity:0}10%{opacity:.9}40%{transform:translateX(-150px);opacity:.9}42%,100%{transform:translateX(-150px);opacity:0}}
@keyframes smoke{0%{transform:translate(0,0) scale(.5);opacity:0}20%{opacity:.75}100%{transform:translate(9px,-30px) scale(1.7);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.fx{display:none}}
</style><defs>
<clipPath id="bounds"><rect width="600" height="1248" rx="14"/></clipPath>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="shade"><stop stop-color="#0d1117" stop-opacity=".8"/><stop offset=".55" stop-color="#0d1117" stop-opacity=".2"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
<linearGradient id="band" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs><rect width="600" height="1248" rx="14" fill="#0d1117"/>
<g clip-path="url(#bounds)"><rect x="12" y="12" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><g class="eq fx" style="animation-delay:0s"><rect x="12" y="12" width="576" height="184" rx="10" fill="#e9b44c" fill-opacity=".05" stroke="#e9b44c" stroke-width="2"/><rect x="468" y="28" width="100" height="24" rx="4" fill="#e9b44c"/><text x="518" y="45" font-size="11" fill="#0d1117" class="tag" text-anchor="middle" font-weight="700">EQUIPPED</text></g><text x="36" y="48" font-size="15" fill="#e9b44c" class="mono">01 / LANGUAGES</text><text x="36" y="84" font-size="22" fill="#e6edf3" >Write the core logic</text><text x="36" y="124" font-size="19" fill="#70c9cb" >Python / JavaScript / TypeScript / C++</text><text x="568" y="178" font-size="10" fill="#a8b3bf" class="tag" text-anchor="end">PRIMARY SLOT</text><path d="M30 12H570" stroke="#70c9cb" stroke-width="2" class="trace" style="animation-delay:-0.0s"/><rect x="12" y="220" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><g class="eq fx" style="animation-delay:2s"><rect x="12" y="220" width="576" height="184" rx="10" fill="#e9b44c" fill-opacity=".05" stroke="#e9b44c" stroke-width="2"/><rect x="468" y="236" width="100" height="24" rx="4" fill="#e9b44c"/><text x="518" y="253" font-size="11" fill="#0d1117" class="tag" text-anchor="middle" font-weight="700">EQUIPPED</text></g><text x="36" y="256" font-size="15" fill="#e9b44c" class="mono">02 / AI &amp; RETRIEVAL</text><text x="36" y="292" font-size="22" fill="#e6edf3" >Ground answers and connect models</text><text x="36" y="332" font-size="19" fill="#70c9cb" >Ollama / Gemini / Groq / Hugging Face /</text><text x="36" y="360" font-size="19" fill="#70c9cb" >ChromaDB / sentence-transformers</text><text x="568" y="386" font-size="10" fill="#a8b3bf" class="tag" text-anchor="end">SECONDARY SLOT</text><path d="M30 220H570" stroke="#70c9cb" stroke-width="2" class="trace" style="animation-delay:-1.4s"/><rect x="12" y="428" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><g class="eq fx" style="animation-delay:4s"><rect x="12" y="428" width="576" height="184" rx="10" fill="#e9b44c" fill-opacity=".05" stroke="#e9b44c" stroke-width="2"/><rect x="468" y="444" width="100" height="24" rx="4" fill="#e9b44c"/><text x="518" y="461" font-size="11" fill="#0d1117" class="tag" text-anchor="middle" font-weight="700">EQUIPPED</text></g><text x="36" y="464" font-size="15" fill="#e9b44c" class="mono">03 / BACKEND</text><text x="36" y="500" font-size="22" fill="#e6edf3" >Expose services and coordinate work</text><text x="36" y="540" font-size="19" fill="#70c9cb" >Node.js / Express / FastAPI / Flask</text><text x="568" y="594" font-size="10" fill="#a8b3bf" class="tag" text-anchor="end">SIDEARM SLOT</text><path d="M30 428H570" stroke="#70c9cb" stroke-width="2" class="trace" style="animation-delay:-2.8s"/><rect x="12" y="636" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><g class="eq fx" style="animation-delay:6s"><rect x="12" y="636" width="576" height="184" rx="10" fill="#e9b44c" fill-opacity=".05" stroke="#e9b44c" stroke-width="2"/><rect x="468" y="652" width="100" height="24" rx="4" fill="#e9b44c"/><text x="518" y="669" font-size="11" fill="#0d1117" class="tag" text-anchor="middle" font-weight="700">EQUIPPED</text></g><text x="36" y="672" font-size="15" fill="#e9b44c" class="mono">04 / DATA</text><text x="36" y="708" font-size="22" fill="#e6edf3" >Store, query and cache</text><text x="36" y="748" font-size="19" fill="#70c9cb" >PostgreSQL / MongoDB / Redis / SQLite</text><text x="568" y="802" font-size="10" fill="#a8b3bf" class="tag" text-anchor="end">THROWABLES SLOT</text><path d="M30 636H570" stroke="#70c9cb" stroke-width="2" class="trace" style="animation-delay:-4.199999999999999s"/><rect x="12" y="844" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><g class="eq fx" style="animation-delay:8s"><rect x="12" y="844" width="576" height="184" rx="10" fill="#e9b44c" fill-opacity=".05" stroke="#e9b44c" stroke-width="2"/><rect x="468" y="860" width="100" height="24" rx="4" fill="#e9b44c"/><text x="518" y="877" font-size="11" fill="#0d1117" class="tag" text-anchor="middle" font-weight="700">EQUIPPED</text></g><text x="36" y="880" font-size="15" fill="#e9b44c" class="mono">05 / INTERFACES</text><text x="36" y="916" font-size="22" fill="#e6edf3" >Make systems usable</text><text x="36" y="956" font-size="19" fill="#70c9cb" >React / React Native / Electron / Streamlit</text><text x="568" y="1010" font-size="10" fill="#a8b3bf" class="tag" text-anchor="end">ATTACHMENTS SLOT</text><path d="M30 844H570" stroke="#70c9cb" stroke-width="2" class="trace" style="animation-delay:-5.6s"/><rect x="12" y="1052" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><g class="eq fx" style="animation-delay:10s"><rect x="12" y="1052" width="576" height="184" rx="10" fill="#e9b44c" fill-opacity=".05" stroke="#e9b44c" stroke-width="2"/><rect x="468" y="1068" width="100" height="24" rx="4" fill="#e9b44c"/><text x="518" y="1085" font-size="11" fill="#0d1117" class="tag" text-anchor="middle" font-weight="700">EQUIPPED</text></g><text x="36" y="1088" font-size="15" fill="#e9b44c" class="mono">06 / DELIVERY</text><text x="36" y="1124" font-size="22" fill="#e6edf3" >Version, test and ship</text><text x="36" y="1164" font-size="19" fill="#70c9cb" >Git / GitHub Actions / Docker / Vercel</text><text x="568" y="1218" font-size="10" fill="#a8b3bf" class="tag" text-anchor="end">BACKPACK SLOT</text><path d="M30 1052H570" stroke="#70c9cb" stroke-width="2" class="trace" style="animation-delay:-7.0s"/></g><rect x="1" y="1" width="598" height="1246" rx="13" fill="none" stroke="#30363d"/></svg>
