<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="618" viewBox="0 0 1200 618" role="img" aria-labelledby="title">
<title id="title">Build kit: tools grouped by purpose.</title><style>
text{font-family:Arial,Helvetica,sans-serif}.mono{font-family:Consolas,monospace;letter-spacing:2px}
.trace{stroke-dasharray:160 1240;animation:trace 9s linear infinite}
.pulse{animation:pulse 6s ease-in-out infinite}
.orbit{transform-origin:0 0;animation:orbit 28s linear infinite}
.scan{animation:scan 10s ease-in-out infinite}
.spark{animation:spark 9s ease-in-out infinite}
.s1{animation:s1 12s ease-in-out infinite}.s2{animation:s2 12s ease-in-out infinite}.s3{animation:s3 12s ease-in-out infinite}
@keyframes trace{to{stroke-dashoffset:-1400}}
@keyframes pulse{50%{opacity:.35}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes scan{0%,100%{transform:translateY(0);opacity:0}20%,70%{opacity:.45}80%{transform:translateY(260px);opacity:0}}
@keyframes spark{0%,100%{opacity:0;transform:translateY(10px)}40%{opacity:.6}90%{transform:translateY(-35px);opacity:0}}
@keyframes s1{0%,25%,100%{opacity:1}35%,85%{opacity:.35}}
@keyframes s2{0%,20%,70%,100%{opacity:.35}35%,55%{opacity:1}}
@keyframes s3{0%,50%,100%{opacity:.35}65%,90%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.scan,.spark{display:none}}
</style><defs>
<clipPath id="bounds"><rect width="1200" height="618" rx="14"/></clipPath>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#0d1117" stop-opacity="0"/><stop offset="1" stop-color="#0d1117"/></linearGradient>
<linearGradient id="shade"><stop stop-color="#0d1117" stop-opacity=".8"/><stop offset=".55" stop-color="#0d1117" stop-opacity=".2"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/></linearGradient>
</defs><rect width="1200" height="618" rx="14" fill="#0d1117"/>
<g clip-path="url(#bounds)"><rect x="12" y="12" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><text x="36" y="48" font-size="15" fill="#e9b44c" class="mono">01 / LANGUAGES</text><text x="36" y="84" font-size="22" fill="#e6edf3" >Write the core logic</text><text x="36" y="124" font-size="19" fill="#70c9cb" >Python / JavaScript / TypeScript / C++</text><rect x="612" y="12" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><text x="636" y="48" font-size="15" fill="#e9b44c" class="mono">02 / AI &amp; RETRIEVAL</text><text x="636" y="84" font-size="22" fill="#e6edf3" >Ground answers and connect models</text><text x="636" y="124" font-size="19" fill="#70c9cb" >Ollama / Gemini / Groq / Hugging Face /</text><text x="636" y="152" font-size="19" fill="#70c9cb" >ChromaDB / sentence-transformers</text><rect x="12" y="218" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><text x="36" y="254" font-size="15" fill="#e9b44c" class="mono">03 / BACKEND</text><text x="36" y="290" font-size="22" fill="#e6edf3" >Expose services and coordinate work</text><text x="36" y="330" font-size="19" fill="#70c9cb" >Node.js / Express / FastAPI / Flask</text><rect x="612" y="218" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><text x="636" y="254" font-size="15" fill="#e9b44c" class="mono">04 / DATA</text><text x="636" y="290" font-size="22" fill="#e6edf3" >Store, query and cache</text><text x="636" y="330" font-size="19" fill="#70c9cb" >PostgreSQL / MongoDB / Redis / SQLite</text><rect x="12" y="424" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><text x="36" y="460" font-size="15" fill="#e9b44c" class="mono">05 / INTERFACES</text><text x="36" y="496" font-size="22" fill="#e6edf3" >Make systems usable</text><text x="36" y="536" font-size="19" fill="#70c9cb" >React / React Native / Electron / Streamlit</text><rect x="612" y="424" width="576" height="184" rx="10" fill="#161b22" stroke="#30363d"/><text x="636" y="460" font-size="15" fill="#e9b44c" class="mono">06 / DELIVERY</text><text x="636" y="496" font-size="22" fill="#e6edf3" >Version, test and ship</text><text x="636" y="536" font-size="19" fill="#70c9cb" >Git / GitHub Actions / Docker / Vercel</text></g><rect x="1" y="1" width="1198" height="616" rx="13" fill="none" stroke="#30363d"/></svg>
