<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="100%" role="img" aria-labelledby="t d">
<title id="t">Aditya Singh: LLM systems, AI agents, full-stack</title>
<desc id="d">Models propose. Code verifies. People decide. A typed line cycles through: I build LLM agents that are safe to act on / checked by deterministic code / grounded by retrieval / approved by a person before anything irreversible. Below it, a three-stage pipeline from model to verification to a person signing off. IIT Madras, BS Data Science, CGPA 9.0. Runner-up, Paradox DSA Triathlon 2026.</desc>
