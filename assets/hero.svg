<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" role="img" aria-labelledby="t d">
<title id="t">Aditya Singh: LLM systems, AI agents, full-stack</title>
<desc id="d">Models propose. Code verifies. People decide. A three-stage pipeline from model to verification to a person signing off.</desc>
<defs>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2dd4bf"/><stop offset="0.55" stop-color="#a7f3d0"/><stop offset="1" stop-color="#f5a524"/>
  </linearGradient>
  <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#1f2630"/></pattern>
  <radialGradient id="glow" cx="50%" cy="30%" r="55%"><stop offset="0" stop-color="#2dd4bf" stop-opacity="0.10"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/></radialGradient>
</defs>
<rect x="0.5" y="0.5" width="899" height="299" rx="16" fill="#0d1117" stroke="#30363d"/>
<rect x="1" y="1" width="898" height="298" rx="16" fill="url(#dots)"/>
<rect x="1" y="1" width="898" height="298" rx="16" fill="url(#glow)"/>
<text x="450" y="88" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="7" fill="url(#name)">ADITYA SINGH</text>
<text x="450" y="122" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="3" fill="#8b949e">LLM SYSTEMS  ·  AI AGENTS  ·  FULL-STACK</text>
<text x="450" y="166" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#e6edf3">Models <tspan fill="#2dd4bf" font-weight="700">propose</tspan>. Code <tspan fill="#f5a524" font-weight="700">verifies</tspan>. People <tspan fill="#c9d1d9" font-weight="700">decide</tspan>.</text>
<line x1="338" y1="223" x2="382" y2="223" stroke="#484f58" stroke-width="1.5"/><path d="M376,218 L382,223 L376,228" fill="none" stroke="#484f58" stroke-width="1.5"/><line x1="518" y1="223" x2="562" y2="223" stroke="#484f58" stroke-width="1.5"/><path d="M556,218 L562,223 L556,228" fill="none" stroke="#484f58" stroke-width="1.5"/>
<!-- Drawn under the nodes so the pulse shows only on the connectors -->
<circle r="4" fill="#e6edf3">
  <animateMotion id="pulse" path="M208,223 L692,223" dur="4.2s" begin="0s;pulse.end+0.8s" keyPoints="0;1" keyTimes="0;1" calcMode="linear"/>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="4.2s" begin="0s;pulse.end+0.8s"/>
</circle>
<rect x="208" y="206" width="124" height="34" rx="17" fill="#161b22" stroke="#2dd4bf" stroke-width="1.5"/><text x="270" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#2dd4bf">MODEL</text><text x="270" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">drafts the answer</text><rect x="208" y="206" width="124" height="34" rx="17" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" values="0;0.18;0" keyTimes="0;0.5;1" dur="1.2s" begin="0.0s;pulse.end+0.0s"/></rect><rect x="388" y="206" width="124" height="34" rx="17" fill="#161b22" stroke="#f5a524" stroke-width="1.5"/><text x="450" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#f5a524">VERIFY</text><text x="450" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">rules and tests check it</text><rect x="388" y="206" width="124" height="34" rx="17" fill="#f5a524" opacity="0"><animate attributeName="opacity" values="0;0.18;0" keyTimes="0;0.5;1" dur="1.2s" begin="1.4s;pulse.end+1.4s"/></rect><rect x="568" y="206" width="124" height="34" rx="17" fill="#161b22" stroke="#c9d1d9" stroke-width="1.5"/><text x="630" y="228" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#c9d1d9">PERSON</text><text x="630" y="266" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#8b949e">signs off on the action</text><rect x="568" y="206" width="124" height="34" rx="17" fill="#c9d1d9" opacity="0"><animate attributeName="opacity" values="0;0.18;0" keyTimes="0;0.5;1" dur="1.2s" begin="2.8s;pulse.end+2.8s"/></rect>
</svg>
