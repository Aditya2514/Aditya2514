<g clip-path="url(#k-card)"><rect width="456" height="726" fill="#07090d"/><rect width="319.2" height="726" fill="url(#k-glow)"/>
<circle cx="27" cy="36" r="3.5" fill="#5ed3e8" class="pulse" /><text x="38" y="40" font-size="12" fill="#5ed3e8" font-weight="500" letter-spacing="1.6" class="m">02 / LOCAL DESKTOP AGENT</text><text x="22" y="104" font-size="50" fill="#f1f4f7" font-weight="800" letter-spacing="-1.5">Pikina</text><text x="24" y="144" font-size="22" fill="#f1f4f7" font-weight="600">Your machine.</text><text x="24" y="173" font-size="22" fill="#5ed3e8" font-weight="600">Your call.</text><text x="24" y="208" font-size="15" fill="#aeb8c4">An offline-first assistant for Windows and Linux. Every</text><text x="24" y="230" font-size="15" fill="#aeb8c4">tool the model proposes is validated, and high-risk</text><text x="24" y="252" font-size="15" fill="#aeb8c4">actions wait for your consent. Pre-alpha.</text><rect x="24" y="282" width="62.1" height="24" rx="12" fill="#121821" stroke="#2c3848"/><text x="34" y="298.14" font-size="11.5" fill="#aeb8c4" font-weight="500" class="m">Python</text><rect x="92.1" y="282" width="76.1" height="24" rx="12" fill="#121821" stroke="#2c3848"/><text x="102.1" y="298.14" font-size="11.5" fill="#aeb8c4" font-weight="500" class="m">Electron</text><rect x="174.2" y="282" width="62.1" height="24" rx="12" fill="#121821" stroke="#2c3848"/><text x="184.2" y="298.14" font-size="11.5" fill="#aeb8c4" font-weight="500" class="m">Ollama</text><rect x="242.3" y="282" width="62.1" height="24" rx="12" fill="#121821" stroke="#2c3848"/><text x="252.3" y="298.14" font-size="11.5" fill="#aeb8c4" font-weight="500" class="m">SQLite</text><text x="24" y="336" font-size="12" fill="#5ed3e8" font-weight="500" letter-spacing="1.6" class="m">OPEN REPOSITORY</text><path class="nudge" d="M166 332h20m-6-5 6 5-6 5" fill="none" stroke="#5ed3e8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="18" y="356" width="420" height="352" rx="14" fill="#0c1017" stroke="#1c2530" /><g transform="translate(18 356)"><text x="20" y="28" font-size="11" fill="#5ed3e8" font-weight="500" letter-spacing="1.6" class="m">DESKTOP / ACTION REVIEW</text><text x="400" y="28" font-size="10" fill="#7d8997" font-weight="500" text-anchor="end" letter-spacing="1.6" class="m">ILLUSTRATIVE</text><rect x="20" y="44" width="380" height="42" rx="10" fill="#07090d" stroke="#2c3848" /><text x="34" y="71" font-size="17" fill="#5ed3e8" font-weight="700" class="m">›</text><clipPath id="pk-type-c"><rect x="50" y="54" width="200" height="25"/></clipPath><text x="52" y="70" font-size="14" fill="#f1f4f7" font-weight="500" class="m">delete the temp folder</text><g clip-path="url(#pk-type-c)"><g class="pk-type fx"><rect x="51" y="56" width="198" height="21" fill="#07090d"/><rect class="caret" x="52" y="58" width="2" height="16" fill="#aeb8c4"/></g></g><rect x="20" y="100" width="120" height="58" rx="10" fill="#07090d" stroke="#2c3848" /><g class="pk-g0"><rect x="20" y="100" width="120" height="58" rx="10" fill="#121821" stroke="#5ed3e8" /><circle cx="124" cy="116" r="3" fill="#5ed3e8" /></g><text x="32" y="122" font-size="11" fill="#f1f4f7" font-weight="500" letter-spacing="1.6" class="m">ROUTE</text><text x="32" y="143" font-size="10.5" fill="#aeb8c4" class="m">regex → LLM</text><rect x="150" y="100" width="120" height="58" rx="10" fill="#07090d" stroke="#2c3848" /><g class="pk-g1"><rect x="150" y="100" width="120" height="58" rx="10" fill="#121821" stroke="#5ed3e8" /><circle cx="254" cy="116" r="3" fill="#5ed3e8" /></g><text x="162" y="122" font-size="11" fill="#f1f4f7" font-weight="500" letter-spacing="1.6" class="m">VALIDATE</text><text x="162" y="143" font-size="10.5" fill="#aeb8c4" class="m">tool + args</text><path d="M141 129h7" stroke="#7d8997" stroke-width="1.5"/><rect x="280" y="100" width="120" height="58" rx="10" fill="#07090d" stroke="#2c3848" /><g class="pk-g2"><rect x="280" y="100" width="120" height="58" rx="10" fill="#121821" stroke="#5ed3e8" /><circle cx="384" cy="116" r="3" fill="#5ed3e8" /></g><text x="292" y="122" font-size="11" fill="#f1f4f7" font-weight="500" letter-spacing="1.6" class="m">CONSENT</text><text x="292" y="143" font-size="10.5" fill="#aeb8c4" class="m">high risk: ask</text><path d="M271 129h7" stroke="#7d8997" stroke-width="1.5"/><g class="pk-call"><rect x="20" y="172" width="380" height="50" rx="10" fill="#07090d" stroke="#2c3848" /><text x="34" y="190" font-size="10" fill="#a698ff" font-weight="500" letter-spacing="1.6" class="m">MODEL PROPOSES</text><text x="34" y="211" font-size="14" fill="#f1f4f7" font-weight="500" class="m">files.delete(&quot;~/tmp&quot;)</text></g><g class="pk-risk"><rect x="304" y="184" width="84" height="26" rx="13" fill="#ff6b63" fill-opacity=".14" stroke="#ff6b63"/><text x="346" y="201.5" font-size="10.5" fill="#ff6b63" font-weight="700" text-anchor="middle" letter-spacing="0.8" class="m">HIGH RISK</text></g><g class="pk-ask"><rect x="20" y="236" width="380" height="96" rx="12" fill="#121821" stroke="#5ed3e8" stroke-opacity=".6"/><text x="36" y="263" font-size="15" fill="#f1f4f7" font-weight="600">Delete the folder ~/tmp?</text><text x="36" y="284" font-size="12.5" fill="#aeb8c4">Nothing runs until you approve.</text><rect x="210" y="294" width="84" height="28" rx="8" fill="#07090d" stroke="#2c3848" /><text x="252" y="313" font-size="13" fill="#aeb8c4" font-weight="600" text-anchor="middle">Deny</text><rect x="304" y="294" width="84" height="28" rx="8" fill="#07090d" stroke="#5ed3e8" /><rect class="pk-yes" x="304" y="294" width="84" height="28" rx="8" fill="#5ed3e8"/><text x="346" y="313" font-size="13" fill="#f1f4f7" font-weight="700" text-anchor="middle">Approve</text><g class="pk-yes"><text x="346" y="313" font-size="13" fill="#07090d" font-weight="700" text-anchor="middle">Approve</text></g><g class="pk-done"><circle cx="40" cy="308" r="3.5" fill="#5ee6a0" /><text x="52" y="312.5" font-size="11.5" fill="#5ee6a0" font-weight="500" class="m">approved by you</text></g></g><g class="pk-cur fx"><path d="M0 0L0 17L4.5 13L8 20.5L11 19L7.6 11.8L13.5 11.5Z" fill="#f1f4f7" stroke="#07090d" stroke-width="1.2"/></g></g><rect class="comet fx" x="18" y="356" width="420" height="352" rx="14" fill="none" stroke="#5ed3e8" stroke-width="1.5" stroke-linecap="round" pathLength="1000" stroke-dasharray="70 930" style="animation-duration:10s;animation-delay:-3s"/></g>
