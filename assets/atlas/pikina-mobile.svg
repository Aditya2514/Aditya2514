.caret{animation:caret 1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
@keyframes pk-type{0%,3.33%{transform:translateX(0)}16.67%,96%{transform:translateX(194px)}100%{transform:translateX(0)}}.pk-type{animation:pk-type 12s steps(66) infinite}@keyframes pk-g0{0%,16.25%{opacity:0}19.17%,95.00%{opacity:1}97.92%,100%{opacity:0}}.pk-g0{opacity:0;animation:pk-g0 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-g0{opacity:1}}@keyframes pk-g1{0%,33.75%{opacity:0}36.67%,95.00%{opacity:1}97.92%,100%{opacity:0}}.pk-g1{opacity:0;animation:pk-g1 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-g1{opacity:1}}@keyframes pk-g2{0%,48.75%{opacity:0}51.67%,95.00%{opacity:1}97.92%,100%{opacity:0}}.pk-g2{opacity:0;animation:pk-g2 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-g2{opacity:1}}@keyframes pk-call{0%,21.25%{opacity:0}24.17%,95.00%{opacity:1}97.92%,100%{opacity:0}}.pk-call{opacity:0;animation:pk-call 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-call{opacity:1}}@keyframes pk-risk{0%,37.92%{opacity:0}40.83%,95.00%{opacity:1}97.92%,100%{opacity:0}}.pk-risk{opacity:0;animation:pk-risk 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-risk{opacity:1}}@keyframes pk-ask{0%,52.08%{opacity:0}55.00%,95.00%{opacity:1}97.92%,100%{opacity:0}}.pk-ask{opacity:0;animation:pk-ask 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-ask{opacity:1}}@keyframes pk-yes{0%,74.00%{opacity:0}75.00%,95.00%{opacity:1}96.00%,100%{opacity:0}}.pk-yes{opacity:0;animation:pk-yes 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-yes{opacity:1}}@keyframes pk-done{0%,77.08%{opacity:0}80.00%,95.00%{opacity:1}97.92%,100%{opacity:0}}.pk-done{opacity:0;animation:pk-done 12s linear infinite}@media (prefers-reduced-motion:reduce){.pk-done{opacity:1}}@keyframes pk-cur{0%,56%{transform:translate(250px,366px);opacity:0}60%{opacity:1}73%,74.5%{transform:translate(352px,306px)}75.2%{transform:translate(352px,309px)}76%,92%{transform:translate(352px,306px);opacity:1}96%,100%{transform:translate(3