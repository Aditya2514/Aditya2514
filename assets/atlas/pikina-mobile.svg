<svg xmlns="http://www.w3.org/2000/svg" width="456" height="726" viewBox="0 0 456 726" role="img" aria-labelledby="t d">
<title id="t">Pikina — Your machine. Your call.</title><desc id="d">An offline-first assistant for Windows and Linux. Every tool the model proposes is validated, and high-risk actions wait for your consent. Pre-alpha. Stack: Python, Electron, Ollama, SQLite. The animated diagram is illustrative.</desc>
<style>
