<title id="t">Noesis — Find the moment. Cite the source.</title><desc id="d">Searches video, audio, PDFs and images, then links each answer to a timestamp or page. Hybrid retrieval, reranking and an LLM audit. Built with Apurva Patil. Stack: Python, ChromaDB, Whisper, Streamlit. The animated diagram is illustrative.</desc>
