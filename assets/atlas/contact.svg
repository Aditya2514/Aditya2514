<title id="t">Bring the problem. I&#x27;ll bring the checks.</title><desc id="d">Open to AI engineering internships, agent systems and hackathon teams. Links to LinkedIn, email and repositories follow.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.pulse{animation:pulse 2.4s ease-in-out infinite}
.comet{animation:comet 9s linear infinite}
.still{display:none}
@keyframes pulse{50%{opacity:.25}}
@keyframes comet{to{stroke-dashoffset:-1000}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fx{display:none}.still{display:inline}.bw{opacity:.9}}

.ring{transform-box:fill-box;transform-origin:center;animation:ring 16s ease-out infinite}
@keyframes ring{0%{transform:scale(.4);opacity:0}3%{opacity:.95}22%{transform:scale(3.6);opacity:0}100%{transform:scale(3.6);opacity:0}}
.step{animation:step 9s linear infinite}
.s2{animation-delay:3s}.s3{animation-delay:6s}
@keyframes step{0%,30%{opacity:1}36%,94%{opacity:.5}100%{opacity:1}}
.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.blink{animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

.ping{transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:.9}70%,100%{transform:scale(3.2);opacity:0}}
.nudge{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(5px)}}
.bw{opacity:.5;animation:bw 7s linear infinite}
@keyframes bw{0%,100%{opacity:.5}3%{opacity:1}16%{opacity:.5}}
.head{animation:head 7s linear infinite}
@keyframes head{0%{transform:translateX(0);opacity:0}2%{opacity:.9}57%{transform:translateX(var(--run));opacity:.9}60%,100%{transform:translateX(var(--run));opacity:0}}
.kt{opacity:.3;animation:kt 9s linear infinite}
@keyframes kt{0%,100%{opacity:.3}6%{opacity:1}22%{opacity:.3}}
.stop{opacity:.7;animation:stop 8s linear infinite}
@keyframes stop{0%,100%{opacity:.7}4%{opacity:1}30%{opacity:.7}}
.walk{animation:walk 8s linear infinite}
@keyframes walk{0%{transform:translateY(0);opacity:0}3%{opacity:1}82%{transform:translateY(var(--run));opacity:1}88%,100%{transform:translateY(var(--run));opacity:0}}
</style>
